apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-publisher
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: tachyon-pir-publisher
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
    - name: registry-write
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-publisher
spec:
  serviceName: {{ .Release.Name }}-publisher
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tachyon-pir-publisher
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tachyon-pir-publisher
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmaps.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: publisher
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/tachyon-pir-publisher"]
          args: ["--config", "/etc/tachyon-pir/publisher.json"]
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.publisher.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "http://127.0.0.1:9400/health"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "http://127.0.0.1:9400/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/tachyon-pir/publisher.json
              subPath: publisher.json
              readOnly: true
            - name: data
              mountPath: /data
        - name: tls-edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/caddy"]
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          ports:
            - name: https
              containerPort: 8443
            - name: registry-write
              containerPort: 8080
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: tls
              mountPath: /etc/tachyon-pir/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: tls
          secret:
            secretName: {{ .Release.Name }}-publisher-tls
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.publisher.storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.publisher.storage.size }}
