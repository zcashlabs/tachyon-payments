{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}-public
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && (Path(`/registry/v1/challenge`) || Path(`/registry/v1/register`))
      kind: Rule
      priority: 100
      services:
        - name: {{ .Release.Name }}-publisher
          port: 8080
    - match: Host(`{{ .Values.ingress.host }}`) && (PathPrefix(`/memo/v1`) || PathPrefix(`/first-contact/v1`) || PathPrefix(`/tachygram/v1`) || PathPrefix(`/registry/v1`) || PathPrefix(`/v1/`))
      kind: Rule
      priority: 50
      services:
        - name: {{ .Release.Name }}-query
          port: 9510
  tls:
    secretName: {{ .Release.Name }}-public-tls
{{- end }}
