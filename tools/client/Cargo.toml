[package]
name = "tachyon-pir-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Diagnostic probe client for the Tachyon payment PIR services: map, lookup, dummy query, anchor check"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tachyon-pir-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tachyon-pir-protocol = { path = "../../src/shared/tachyon-pir-protocol" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# Query construction and reply decoding on the native 8-bit profile (spec 6.6).
zakura-pir-client = { workspace = true, features = ["native"] }

[dev-dependencies]
axum = "0.7"
# The server side of the in-test query host: scope builder and P8 runtimes.
tachyon-pir-table = { path = "../../src/shared/tachyon-pir-table" }
tokio = { version = "1", features = ["full"] }
