[package]
name = "tachyon-pir-e2e-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "End-to-end harness: TLS edge, spawned processes, node double, HTTP helpers"
license = "MIT OR Apache-2.0"
# Binaries are only the re-declared foreign entrypoints below.
autobins = false

[lib]
path = "src/lib.rs"

# Product end-to-end tests. Every product feature is on by default so that
# `cargo test --workspace` runs the acceptance scenarios (spec 13.2) for
# tachygram, memo, first-contact and registry. The re-declared
# host entrypoints below resolve their `#[cfg(feature = ..)]` against this
# package's features, so each product feature also enables the product in both
# host libraries. First-contact runs inside the memo publisher (spec 11.7), so
# it needs memo.
[features]
default = ["tachygram", "memo", "first-contact", "registry"]
tachygram = ["tachyon-pir-publisher/tachygram", "tachyon-pir-query-server/tachygram"]
memo = ["tachyon-pir-publisher/memo", "tachyon-pir-query-server/memo"]
first-contact = ["memo", "tachyon-pir-publisher/first-contact", "tachyon-pir-query-server/first-contact"]
registry = ["tachyon-pir-publisher/registry", "tachyon-pir-query-server/registry"]

# `CARGO_BIN_EXE_<name>` is set only for binaries of the test's own package, so
# foreign entrypoints are re-declared here, as wallet-pir's pir-e2e-tests does.
# The `-test` suffix keeps the output file apart from the owning package's
# binary when both are built in one workspace invocation.
[[bin]]
name = "tachyon-node-double-test"
path = "../fixtures/src/bin/tachyon-node-double.rs"
test = false
doc = false

[[bin]]
name = "tachyon-pir-publisher-test"
path = "../../src/tachyon-pir-publisher/src/main.rs"
test = false
doc = false

[[bin]]
name = "tachyon-pir-query-server-test"
path = "../../src/tachyon-pir-query-server/src/main.rs"
test = false
doc = false

[[test]]
name = "tachygram"
path = "tests/tachygram.rs"
required-features = ["tachygram"]

# The memo tests need first-contact too: the publisher always hosts both
# (one definition, spec 11.7), and the e2e topology enables both.
[[test]]
name = "memo"
path = "tests/memo.rs"
required-features = ["memo", "first-contact"]

[[test]]
name = "first_contact"
path = "tests/first_contact.rs"
required-features = ["first-contact"]

[[test]]
name = "registry"
path = "tests/registry.rs"
required-features = ["registry"]

[dependencies]
bytes = "1"
# The host entrypoints' own dependencies (their `main.rs` is built here).
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
libc = "0.2"
pir-publication = { workspace = true }
pir-service-discovery = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tachyon-fixtures = { path = "../fixtures" }
# The probe client is the wallet of the product tests (spec 13.1).
tachyon-pir-cli = { path = "../client" }
# The publisher's `current` and inventory, read directly to tell which objects
# a publication consists of.
tachyon-pir-distribution = { path = "../../src/shared/tachyon-pir-distribution" }
tachyon-pir-protocol = { path = "../../src/shared/tachyon-pir-protocol" }
tachyon-pir-publisher = { path = "../../src/tachyon-pir-publisher" }
tachyon-pir-query-server = { path = "../../src/tachyon-pir-query-server" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[dev-dependencies]
axum = "0.7"
# The query host's transport; the harness proves it accepts the edge's origin.
pir-sync-manager = { workspace = true }
