[package]
name = "tachyon-fixtures"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Synthetic Tachyon chains and a JSON-RPC Zakura node double for tests"
license = "MIT OR Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tachyon-node-double"
path = "src/bin/tachyon-node-double.rs"

# The fixtures are the independent oracle for the chain decoder, so this crate
# MUST NOT depend on `tachyon-chain` or any other decoder of the node's JSON.
[dependencies]
bytes = "1"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }

[dev-dependencies]
# The JSON-RPC transport the publisher uses; tests prove the double speaks to it.
pir-node-rpc = { workspace = true }
# The products' envelope parser, used only by tests/envelope.rs to cross-check
# that it accepts every authored envelope and refuses every malformation. The
# library never uses it: the authored ground truth must stay independent.
tachyon-pir-protocol = { path = "../../src/shared/tachyon-pir-protocol" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
