[package]
name = "tachyon-chain"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Tachyon testnet node reads: verbose-block decoding, epoch arithmetic and network identity"

[dependencies]
hex = "0.4"
# Bounded JSON-RPC transport; this crate adds decoding and chain interpretation.
pir-node-rpc = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# The golden expectations carry a SHA-256 over each stamp's tachygrams, computed
# by the capture script with Python's hashlib.
sha2 = "0.10"
# The node double, for NodeClient tests against reorged-away blocks.
tachyon-fixtures = { path = "../../../tools/fixtures" }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }
